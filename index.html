<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sydney Pupuce</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #1e1f29;
      color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .carte {
      background: #2b2d3c;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    .sous-titre { color: #8ea1ff; margin-bottom: 20px; }
    p { line-height: 1.5; margin-bottom: 20px; }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: #8ea1ff; }
    .competences { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .competences span {
      background: #3a3d52;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    a {
      display: inline-block;
      background: #5865f2;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
    }
    a:hover { background: #4752c4; }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Sydney Pupuce</h1>
    <div class="sous-titre">Développeur JavaScript</div>
    <p>Salut ! Moi c'est Sydney. J'aime coder et créer des petits projets. Ici, tu peux voir ce que je sais faire. (Remplace ce texte par ta propre description.)</p>

    <h2>Mes compétences</h2>
    <div class="competences">
      <span>JavaScript</span>
      <span>HTML</span>
      <span>CSS</span>
      <span>Discord bots</span>
    </div>

    <a href="https://github.com/" target="_blank">Mon GitHub</a>
  </div>
</body>
</html>
